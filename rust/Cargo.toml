[package]
name = "fluxv2-rs"
version = "2.0.20"
edition = "2021"
description = "Flux v2 color-temperature control, rewritten in Rust"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.31"
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"
x11rb = { version = "0.13", features = ["randr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
bitflags = "2"
libloading = "0.8"
signal-hook = "0.3"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[build-dependencies]
wayland-scanner = "0.31"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
